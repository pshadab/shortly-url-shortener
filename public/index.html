<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shortly — URL Shortener</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="eyebrow">SIMPLE • FAST • YOURS</p>
        <h1>Make every link<br /><em>short and memorable.</em></h1>
        <p class="intro">Turn long URLs into clean links you can share anywhere.</p>
      </section>
      <section class="card">
        <form id="shorten-form">
          <label for="url">Long URL</label>
          <input id="url" name="url" type="url" placeholder="https://example.com/a-very-long-link" required />
          <label for="code">Custom ending <span>(optional)</span></label>
          <div class="code-field"><span>/s/</span><input id="code" name="code" placeholder="my-link" maxlength="30" /></div>
          <button type="submit">Shorten URL <span>→</span></button>
        </form>
        <div id="result" class="result" hidden></div>
        <p id="message" class="message" role="alert"></p>
      </section>
      <section class="links-section">
        <div class="section-title"><h2>Your recent links</h2><button id="refresh" type="button">Refresh</button></div>
        <div id="links" class="links"><p class="empty">No links yet. Create your first one above.</p></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
